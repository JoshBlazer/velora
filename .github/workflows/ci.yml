name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Type-check & unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: node --max-old-space-size=2048 node_modules/typescript/bin/tsc --noEmit

      # Fails the build on lint errors. Warnings stay visible in the log
      # without gating -- the remaining ones are next/image suggestions for
      # user avatars loaded from arbitrary remote hosts, which is a
      # configuration and cost decision rather than a lint fix.
      - name: Lint
        run: npm run lint

      # The README drifted behind the code three times in a single day, each
      # time within an hour of being declared accurate. This asserts that
      # every npm script and every environment variable the app reads is
      # documented, and that the advertised test counts are real.
      - name: Docs in step with code
        run: npm run check:docs

      - name: Unit tests
        run: npm test
